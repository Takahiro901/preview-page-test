name: Docs PR Preview Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview directory
        run: |
          PREVIEW_DIR="pr-preview/pr-${{ github.event.pull_request.number }}"
          if [ -d "$PREVIEW_DIR" ]; then
            git rm -r --ignore-unmatch "$PREVIEW_DIR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: remove preview for PR #${{ github.event.pull_request.number }}"
            git push
          fi

      - name: Mark preview status check as removed
        uses: actions/github-script@v7
        with:
          script: |
            // 同一context（docs-preview/pr-<番号>）を failure で上書きし、
            // チェック一覧上も「プレビューはもう存在しない」ことが分かるようにする。
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ github.event.pull_request.head.sha }}",
              state: "failure",
              description: "プレビューは削除されました（PRクローズ）",
              context: `docs-preview/pr-${{ github.event.pull_request.number }}`,
            });

      - name: Update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-tag: docs-preview
          edit-mode: replace
          body: |
            📖 このPRのドキュメントプレビューは削除されました（PRがクローズされたため）。
