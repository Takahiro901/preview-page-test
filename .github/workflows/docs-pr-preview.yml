name: Docs PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs-pr-preview.yml"

concurrency:
  group: docs-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs Material
        run: pip install -r requirements-docs.txt

      - name: Build site
        run: mkdocs build --strict --site-dir site

      - name: Deploy preview to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          destination_dir: pr-preview/pr-${{ github.event.pull_request.number }}
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Set preview status check
        id: preview-status
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.pull_request.number }}/`;

            // Commit Status（Statuses API）を使う。
            // 同一context（docs-preview/pr-<番号>）へのPOSTは常に最新のものだけが
            // PRのチェック一覧（マージボックス/Checksタブ）に表示されるため、
            // Deployments APIと違って古いものを掃除する処理が不要。
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ github.event.pull_request.head.sha }}",
              state: "success",
              target_url: previewUrl,
              description: "ドキュメントプレビューを表示",
              context: `docs-preview/pr-${{ github.event.pull_request.number }}`,
            });

            core.setOutput("preview_url", previewUrl);

      - name: Update PR description with preview link
        uses: actions/github-script@v7
        with:
          script: |
            // PRのDescription（本文）自体にプレビューリンクを埋め込む。
            // タイムラインの奥やチェック欄と違い、PRを開いた瞬間に必ず目に入る。
            // マーカーで囲むことで、再pushのたびに重複追記せず同じ箇所を上書きする。
            const previewUrl = "${{ steps.preview-status.outputs.preview_url }}";
            const startMarker = "<!-- docs-preview:start -->";
            const endMarker = "<!-- docs-preview:end -->";
            const block = `${startMarker}\n> 📖 **ドキュメントプレビュー:** ${previewUrl}\n${endMarker}`;

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.pull_request.number }},
            });

            let body = pr.body || "";
            if (body.includes(startMarker) && body.includes(endMarker)) {
              const pattern = new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`);
              body = body.replace(pattern, block);
            } else {
              body = body.trim().length > 0 ? `${body}\n\n${block}` : block;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.pull_request.number }},
              body,
            });

      - name: Comment preview link on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-tag: docs-preview
          edit-mode: replace
          body: |
            📖 ドキュメントプレビューを更新しました。

            **プレビューURL:**
            ${{ steps.preview-status.outputs.preview_url }}

            > PRのチェック欄（`docs-preview/pr-${{ github.event.pull_request.number }}`）からも確認できます。
